<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="romanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="25%" stop-color="#C59A4E" />
      <stop offset="60%" stop-color="#A77A35" />
      <stop offset="100%" stop-color="#7D551A" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2DC9E" />
      <stop offset="50%" stop-color="#B6883D" />
      <stop offset="100%" stop-color="#845D21" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#5C3B12" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Roman Courthouse Temple in Center -->
    <g transform="translate(80, 58)">
      <!-- Pediment (Triangular Gable) -->
      <path d="M-22,-7 L0,-21 L22,-7 Z" fill="url(#goldSheen)" stroke="url(#romanGold)" stroke-width="1.2" stroke-linejoin="round" />
      
      <!-- Cornice / Entablature (Horizontal Beams) -->
      <rect x="-24" y="-7" width="48" height="3" rx="0.5" fill="url(#romanGold)" />
      <rect x="-22" y="-4" width="44" height="2" rx="0.5" fill="url(#goldSheen)" />
      
      <!-- 4 Columns -->
      <!-- Column 1 -->
      <rect x="-19" y="-2" width="5.5" height="17" rx="0.8" fill="url(#romanGold)" />
      <rect x="-20.5" y="-2.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      <rect x="-20.5" y="13.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      
      <!-- Column 2 -->
      <rect x="-7.5" y="-2" width="5.5" height="17" rx="0.8" fill="url(#romanGold)" />
      <rect x="-9" y="-2.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      <rect x="-9" y="13.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      
      <!-- Column 3 -->
      <rect x="2" y="-2" width="5.5" height="17" rx="0.8" fill="url(#romanGold)" />
      <rect x="0.5" y="-2.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      <rect x="0.5" y="13.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      
      <!-- Column 4 -->
      <rect x="13.5" y="-2" width="5.5" height="17" rx="0.8" fill="url(#romanGold)" />
      <rect x="12" y="-2.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      <rect x="12" y="13.5" width="8.5" height="1.8" rx="0.5" fill="url(#goldSheen)" />
      
      <!-- Stepped Base (Stylobate) -->
      <rect x="-23" y="15" width="46" height="2.5" rx="0.5" fill="url(#goldSheen)" />
      <rect x="-25" y="17.5" width="50" height="3" rx="0.5" fill="url(#romanGold)" />
    </g>

    <!-- Laurel Wreath Surrounding the Temple -->
    <!-- Left Branch -->
    <g fill="url(#romanGold)">
      <!-- Branch stem curve -->
      <path d="M74,86 C52,82 36,66 38,44 C39,32 45,21 54,14" fill="none" stroke="url(#romanGold)" stroke-width="1.8" stroke-linecap="round" />
      
      <!-- Leaves paired along the left branch -->
      <!-- Bottom leaves -->
      <path d="M72,83 C67,86 61,84 57,80 C60,78 66,79 72,83 Z" />
      <path d="M66,85 C62,88 56,87 53,82 C56,80 62,81 66,85 Z" />
      
      <!-- Mid-lower leaves -->
      <path d="M57,76 C50,79 44,75 42,70 C46,68 53,70 57,76 Z" />
      <path d="M52,78 C46,80 39,78 37,72 C41,70 47,73 52,78 Z" />
      
      <!-- Mid leaves -->
      <path d="M47,64 C40,66 35,61 34,55 C39,54 44,57 47,64 Z" />
      <path d="M44,66 C37,67 31,64 30,57 C35,56 40,60 44,66 Z" />
      
      <!-- Mid-upper leaves -->
      <path d="M42,50 C36,50 32,44 33,38 C37,39 41,43 42,50 Z" />
      <path d="M40,52 C33,52 28,47 30,40 C34,42 38,47 40,52 Z" />
      
      <!-- Upper leaves -->
      <path d="M42,36 C37,34 35,28 38,22 C42,24 44,29 42,36 Z" />
      <path d="M44,37 C39,33 38,27 42,22 C45,25 46,31 44,37 Z" />
      
      <!-- Top leaves -->
      <path d="M48,24 C44,20 45,14 50,10 C53,13 52,19 48,24 Z" />
      <path d="M54,16 C51,12 53,7 58,4 C61,7 59,13 54,16 Z" />
      <path d="M58,15 C56,10 60,6 64,4 C66,8 63,13 58,15 Z" />
    </g>

    <!-- Right Branch (Mirrored) -->
    <g fill="url(#romanGold)" transform="translate(160, 0) scale(-1, 1)">
      <!-- Branch stem curve -->
      <path d="M74,86 C52,82 36,66 38,44 C39,32 45,21 54,14" fill="none" stroke="url(#romanGold)" stroke-width="1.8" stroke-linecap="round" />
      
      <!-- Leaves paired along the right branch -->
      <!-- Bottom leaves -->
      <path d="M72,83 C67,86 61,84 57,80 C60,78 66,79 72,83 Z" />
      <path d="M66,85 C62,88 56,87 53,82 C56,80 62,81 66,85 Z" />
      
      <!-- Mid-lower leaves -->
      <path d="M57,76 C50,79 44,75 42,70 C46,68 53,70 57,76 Z" />
      <path d="M52,78 C46,80 39,78 37,72 C41,70 47,73 52,78 Z" />
      
      <!-- Mid leaves -->
      <path d="M47,64 C40,66 35,61 34,55 C39,54 44,57 47,64 Z" />
      <path d="M44,66 C37,67 31,64 30,57 C35,56 40,60 44,66 Z" />
      
      <!-- Mid-upper leaves -->
      <path d="M42,50 C36,50 32,44 33,38 C37,39 41,43 42,50 Z" />
      <path d="M40,52 C33,52 28,47 30,40 C34,42 38,47 40,52 Z" />
      
      <!-- Upper leaves -->
      <path d="M42,36 C37,34 35,28 38,22 C42,24 44,29 42,36 Z" />
      <path d="M44,37 C39,33 38,27 42,22 C45,25 46,31 44,37 Z" />
      
      <!-- Top leaves -->
      <path d="M48,24 C44,20 45,14 50,10 C53,13 52,19 48,24 Z" />
      <path d="M54,16 C51,12 53,7 58,4 C61,7 59,13 54,16 Z" />
      <path d="M58,15 C56,10 60,6 64,4 C66,8 63,13 58,15 Z" />
    </g>

    <!-- Bottom Ribbon / Tie -->
    <g transform="translate(80, 87)" fill="url(#goldSheen)">
      <circle cx="0" cy="0" r="2.5" />
      <path d="M-2,1 C-4,4 -8,8 -10,10 C-8,10 -4,6 -1,3 Z" />
      <path d="M2,1 C4,4 8,8 10,10 C8,10 4,6 1,3 Z" />
    </g>
  </g>
</svg>

